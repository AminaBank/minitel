daemon off;
error_log /dev/stderr;
pid /tmp/nginx/nginx.pid;

events {}

http {
    server {
        listen 8088;
        
        # Set a number of log, temp and cache file options that will otherwise
        # default to restricted locations accessible only to root.
        access_log /dev/stdout;
        client_body_temp_path /tmp/nginx/client_body;
        fastcgi_temp_path /tmp/nginx/fastcgi_temp;
        proxy_temp_path /tmp/nginx/proxy_temp;
        scgi_temp_path /tmp/nginx/scgi_temp;
        uwsgi_temp_path /tmp/nginx/uwsgi_temp;

        # MAIN → redirect to ETH
        location = / {
            return 302 /eth/;
        }

        # ETH
        location /eth/ {
            proxy_pass http://127.0.0.1:3000/eth/;
            proxy_set_header Host $host;
        }

        # SOL
        location /sol/ {
            proxy_pass http://127.0.0.1:3001/sol/;
            proxy_set_header Host $host;
        }
    }
}