[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=0
logfile_backups=0
user=satoshi

[program:nginx]
command=nginx -p /tmp/nginx -c /etc/nginx/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:minitel]
command=bun --cwd=/app run dev
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0