events {}

http {
    server {
        error_log /var/log/nginx/error.log debug;

        listen 80;

        # MAIN → redirect to ETH
        location = / {
            return 302 /eth/;
        }

        # ETH
        location /eth/ {
            proxy_pass http://127.0.0.1:3000/eth/;
            proxy_set_header Host $host;
        }

        # SOL
        location /sol/ {
            proxy_pass http://127.0.0.1:3001/sol/;
            proxy_set_header Host $host;
        }
    }
}